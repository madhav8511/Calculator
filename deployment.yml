- name: Pull and create Calculator Docker container
  hosts: local
  gather_facts: false

  tasks:
    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started

    - name: Pull latest Calculator image
      ansible.builtin.command: docker pull madhavgirdhar/calculator:latest

    - name: Remove existing Calculator container if present
      ansible.builtin.command: docker rm -f calculator
      ignore_errors: yes

    - name: Create Calculator container (do not start)
      ansible.builtin.command: docker create -it --name calculator madhavgirdhar/calculator:latest